workflows:
  ultra_python_runner:
    name: Ultra Python Runner
    max_build_duration: 60

    environment:
      python: 3.10

    scripts:
      - name: Check project files
        script: |
          echo "Project files:"
          ls -la

      - name: Install dependencies
        script: |
          python3 -m pip install --upgrade pip
          pip3 install aiohttp pyTelegramBotAPI pymongo pytz psutil

      - name: Give execute permission to binary
        script: |
          chmod +x ultra

      - name: Test ultra binary
        script: |
          echo "Testing binary..."
          ./ultra || true

      - name: Run ultra.py
        script: |
          python3 ultra.py
